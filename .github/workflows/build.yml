name: PBRP build (begonia)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'pb_begonia-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'recoveryimage'
      jobs:
        description: 'Parallel make jobs'
        required: false
        # android-14.0 has ~2x the projects of android-12.1 and a cold ccache;
        # at -j4 the compile starved the runner for RAM (see the Compile step).
        default: '2'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MANIFEST_URL: 'https://github.com/PitchBlackRecoveryProject/manifest_pb.git'
  MANIFEST_BRANCH: 'android-14.0'
  SRC_DIR: 'aosp'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'
  # AOSP 14 defaults to Bazel mixed builds (defaultBazelProdMode == true),
  # which makes soong run bp2build: a second full analysis of every
  # Android.bp in the tree, just to emit Bazel BUILD files we never use.
  # On a cold 513-project tree that single step burned 44+ minutes and most
  # of the runner's RAM before the first run died. soong's own comment on
  # the flag: "for users which experience broken bazel-handled builds, or
  # significant performance regressions."
  BUILD_BROKEN_DISABLE_BAZEL: 'true'

jobs:
  build:
    name: Compile PBRP recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show parameters
        run: |
          echo "manifest   : $MANIFEST_URL @ $MANIFEST_BRANCH"
          echo "lunch      : ${{ inputs.makefile || 'pb_begonia-eng' }}"
          echo "target     : ${{ inputs.build_target || 'recoveryimage' }}"
          echo "jobs       : ${{ inputs.jobs || '2' }}"
          echo "ccache     : ${{ inputs.ccache || 'true' }}"
          echo "free space before:"
          df -h /

      - name: Free disk space
        run: |
          # android-14.0's remove-minimal.xml keeps ~513 projects where
          # android-12.1 kept ~252, so the checkout is much bigger here.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    "$AGENT_TOOLSDIRECTORY/CodeQL" \
                    "$AGENT_TOOLSDIRECTORY/Python" \
                    /usr/local/share/boost \
                    /opt/hostedtoolcache/CodeQL \
                    /var/lib/docker /usr/share/swift /usr/local/.ghcup \
                    /usr/share/miniconda /usr/share/az_* 2>/dev/null || true
          sudo apt-get clean || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush rsync schedtool squashfs-tools unzip \
            xsltproc zip zlib1g-dev openjdk-17-jdk-headless
          java -version 2>&1

      - name: Set JDK 17
        # AOSP 14 builds against prebuilts/jdk/jdk17 and soong forces
        # JAVA_HOME to it anyway; this only keeps the system default in sync.
        run: |
          JAVA17=""
          for c in "${JAVA_HOME_17_X64:-}" \
                   /usr/lib/jvm/java-17-openjdk-amd64 \
                   /usr/lib/jvm/java-1.17.0-openjdk-amd64; do
            if [ -n "$c" ] && [ -x "$c/bin/java" ]; then JAVA17="$c"; break; fi
          done
          if [ -z "$JAVA17" ]; then
            echo "::error::no JDK 17 found"
            exit 1
          fi
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "Using JDK at $JAVA17"
          "$JAVA17/bin/java" -version 2>&1

      - name: Add swap (recovery link steps are memory hungry)
        run: |
          echo "=== swap before ==="
          swapon --show || true
          free -h
          sudo timeout 120 swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # Prefer paging out over stalling: a stalled shell means the runner
          # agent misses its heartbeat and GitHub reports "lost communication".
          sudo sysctl -w vm.swappiness=100
          echo "=== swap after ==="
          swapon --show
          free -h
          free -h

      - name: Install repo launcher
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          repo --version | head -2

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-begonia14-${{ github.run_id }}
          restore-keys: |
            ccache-begonia14-

      - name: ccache configuration
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G
          ccache --zero-stats || true

      - name: repo init
        run: |
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"
          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1
          # Device tree + removal of the dead upstream vendor_utils project.
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/local_manifests/begonia.xml" .repo/local_manifests/
          echo "--- local manifest in effect ---"
          cat .repo/local_manifests/begonia.xml
          echo "--- project count ---"
          repo list | wc -l

      - name: repo sync
        run: |
          cd "$SRC_DIR"
          repo sync \
            -c -j8 \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune
          echo "--- disk after sync ---"
          df -h /
          echo "--- device tree present? ---"
          ls device/xiaomi/begonia

      - name: Trim disk before build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          # Drop .git for the largest prebuilt/toolchain trees: they are not
          # needed to build, and this frees roughly 10 GB.
          du -sh "$SRC_DIR" 2>/dev/null || true
          find "$SRC_DIR/prebuilts" -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find "$SRC_DIR/.repo/project-objects" -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Compile
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          BUILD_JOBS: ${{ inputs.jobs || '2' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'pb_begonia-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'recoveryimage' }}
        run: |
          cd "$SRC_DIR"
          set -o pipefail

          # GitHub discards a job's entire log if its runner stops answering,
          # and `gh run cancel` destroys it too - three runs in a row produced
          # no log at all. Annotations are streamed to GitHub the moment they
          # are written, so report the diagnosis there instead of relying on
          # the log surviving.
          STAGE=init
          BUILD=""
          MONITOR=""
          WARNSTATE=""
          LOWCOUNT=0
          esc() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          note() { echo "::error title=$(esc "$1")::$(esc "$2")"; }
          warn() { echo "::warning title=$(esc "$1")::$(esc "$2")"; }
          # A runner that dies takes its whole log with it, but notices sent
          # before the death stay on the run - so record every stage change.
          stage() { STAGE="$1"; echo "::notice title=compile stage::$STAGE"; }
          report() {
            local rc="$1"
            note "Compile failed" "stage=${STAGE} exit=${rc} jobs=${BUILD_JOBS}"
            if [ -s build.log ]; then
              note "build.log tail" "$(tail -n 14 build.log | tr '\n' '|')"
            else
              note "build.log tail" "(empty - died before mka wrote anything)"
            fi
            note "resources" "$(free -h | tr '\n' ';') | root:$(df -h / | tail -1 | tr -s ' ')"
          }
          on_exit() {
            local rc=$?
            trap - EXIT
            { [ -n "$MONITOR" ] && kill "$MONITOR" 2>/dev/null; } || true
            if [ "$rc" -ne 0 ]; then
              report "$rc"
              # Do not leave ninja/soong orphaned: a wedged process tree is
              # how the previous jobs ended up never sending their completion.
              pkill -TERM -f 'soong_ui.bash|bin/ninja|soong_build|ckati' 2>/dev/null || true
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          # Drop this step's priority so the runner agent keeps enough CPU to
          # heartbeat. Losing the heartbeat makes GitHub discard the whole job
          # (and its logs) with "The hosted runner lost communication".
          renice -n 10 -p $$ 2>/dev/null || true

          stage envsetup
          source build/envsetup.sh
          stage lunch
          lunch "$MAKEFILE_NAME"

          stage resources
          echo "=== resources before compile ==="
          free -h
          df -h /
          cat /proc/loadavg

          RESMON="$GITHUB_WORKSPACE/resmon.log"
          (
            while true; do
              {
                printf -- '--- %s ---\n' "$(date -u +%FT%TZ)"
                free -h
                df -h /
                cat /proc/loadavg
              } >> "$RESMON" 2>&1
              sleep 30
            done
          ) &
          MONITOR=$!

          stage build
          # Own subshell so the pipeline's exit status survives for `wait`.
          (
            set -o pipefail
            mka --skip-soong-tests "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 | tee build.log
          ) &
          BUILD=$!

          stage guard
          ABORT=""
          while kill -0 "$BUILD" 2>/dev/null; do
            AVAIL_KB=$(df --output=avail -k . 2>/dev/null | tail -1 | tr -dc '0-9' || true)
            MEM_KB=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo || true)
            SWAP_KB=$(awk '/^SwapFree:/{print $2}' /proc/meminfo || true)
            if [ -n "$AVAIL_KB" ] && [ "$AVAIL_KB" -lt 3145728 ]; then
              ABORT="disk below 3 GB free"
            elif [ -n "$MEM_KB" ] && [ -n "$SWAP_KB" ] && [ $((MEM_KB + SWAP_KB)) -lt 786432 ]; then
              ABORT="RAM+swap below ~768 MB"
            fi
            NEAR=""
            if [ -n "$AVAIL_KB" ] && [ "$AVAIL_KB" -lt 6291456 ]; then
              NEAR="disk ${AVAIL_KB} kB free"
            elif [ -n "$MEM_KB" ] && [ -n "$SWAP_KB" ] && [ $((MEM_KB + SWAP_KB)) -lt 1572864 ]; then
              NEAR="RAM+swap $(( (MEM_KB + SWAP_KB) / 1024 )) MB free"
            fi
            if [ -n "$NEAR" ] && [ "$NEAR" != "$WARNSTATE" ]; then
              WARNSTATE="$NEAR"
              warn "resources low" "$NEAR at stage=$STAGE | last: $(tail -n 1 build.log 2>/dev/null | tr '\n' ' ')"
            fi
            if [ -n "$ABORT" ]; then
              LOWCOUNT=$((LOWCOUNT + 1))
              if [ "$LOWCOUNT" -lt 4 ]; then
                warn "resources critical" "$ABORT - sample $LOWCOUNT/4, waiting to see if it recovers"
                ABORT=""
              fi
            else
              LOWCOUNT=0
            fi
            if [ -n "$ABORT" ]; then
              note "resource guard tripped" "$ABORT (built so far: $(tail -n 1 build.log 2>/dev/null | tr '\n' ' '))"
              printf 'ABORT: %s\n' "$ABORT" >> "$RESMON"
              pkill -TERM -f 'soong_ui.bash|bin/ninja|soong_build|ckati|ld.lld' 2>/dev/null || true
              sleep 15
              pkill -KILL -f 'soong_ui.bash|bin/ninja|soong_build|ckati|ld.lld' 2>/dev/null || true
              break
            fi
            sleep 15
          done

          stage wait
          STATUS=0
          wait "$BUILD" || STATUS=$?
          echo "=== resources after compile (exit $STATUS) ==="
          free -h
          df -h /
          exit "$STATUS"

      - name: Locate and verify output image
        id: image
        run: |
          cd "$SRC_DIR"
          echo "=== candidate images ==="
          find out/target/product -maxdepth 2 \
            \( -name 'recovery*.img' -o -name 'recovery*.zip' \) \
            -type f -exec ls -la {} \;
          IMG=$(find out/target/product -maxdepth 2 -name 'recovery.img' -type f | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::recovery.img was not produced"
            exit 1
          fi
          cp "$IMG" "$GITHUB_WORKSPACE/recovery.img"
          cd "$GITHUB_WORKSPACE"
          echo "=== sha256 / size ==="
          sha256sum recovery.img
          ls -la recovery.img
          echo "=== avb info ==="
          "$SRC_DIR"/out/host/linux-x86/bin/avbtool info_image --image recovery.img || true
          echo "image_path=recovery.img" >> "$GITHUB_OUTPUT"

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Dump build logs on failure
        if: failure()
        run: |
          echo "=== host resources right now ==="
          free -h
          df -h /
          cat /proc/loadavg
          echo
          echo "=== resource monitor log ==="
          cat "$GITHUB_WORKSPACE/resmon.log" 2>/dev/null || echo "(none)"
          if [ ! -d "$SRC_DIR" ]; then
            echo "source tree '$SRC_DIR' does not exist; nothing else to dump"
            exit 0
          fi
          cd "$SRC_DIR"
          echo "=== out/error.log ==="
          cat out/error.log 2>/dev/null || echo "(none)"
          echo
          echo "=== first failing lines from build.log ==="
          grep -n -i -m 60 -E "error:|Error [0-9]+|No rule to make target|FAILED:" build.log 2>/dev/null || echo "(none)"
          echo
          echo "=== tail of build.log ==="
          tail -n 200 build.log 2>/dev/null || true

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbrp-begonia-recovery
          path: recovery.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.SRC_DIR }}/build.log
            ${{ env.SRC_DIR }}/out/error.log
            ${{ env.SRC_DIR }}/out/soong/soong.log
            ${{ env.SRC_DIR }}/out/soong/soong_build_error.log
            resmon.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: ${{ (inputs.publish_release || false) == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          SHA=$(sha256sum recovery.img | awk '{print $1}')
          # GITHUB_REF_NAME is the dispatched branch, not a tag; name the
          # release after the manifest branch instead.
          TAG="pbrp-begonia-${MANIFEST_BRANCH}"
          {
            echo "PBRP recovery for Redmi Note 8 Pro (begonia)"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- sha256: \`$SHA\`"
            echo "- built by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md
          gh release create "$TAG" recovery.img --title "PBRP begonia $TAG" \
            --notes-file release-notes.md || \
          gh release upload "$TAG" recovery.img --clobber